<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gorilla Poster</title>
  <style>
    .gallery {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
  margin-top: 20px;
}

.gallery img {
  width: 100%;
  border-radius: 8px;
  transition: transform 0.2s;
}

.gallery img:hover {
  transform: scale(1.05);
}
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f1a12;
      color: white;
      text-align: center;
    }
    header {
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }
    img {
      max-width: 90%;
      height: auto;
      border-radius: 12px;
      margin-top: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    footer {
      margin-top: 20px;
      padding: 15px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

  <header>Gorilla Tourism Poster</header>

  <!-- Replace poster.jpg with your file name -->
  <div class="gallery">
  <img src="posters/poster1.jpg">
  <img src="posters/poster2.jpg">
  <img src="posters/poster3.jpg">

</div>

  <footer>Discover. Respect. Protect.</footer>

</body>
</html>
